seed: 42

# Batch configuration
batch_size: 16
gradient_accumulation_steps: 8
context_length: 512
effective_tokens_per_update: 65536

# Training duration
total_steps: 10

# Optimizer
learning_rate: 3.0e-4
beta1: 0.9
beta2: 0.95
eps: 1.0e-8
weight_decay: 0.1

# LR scheduler
warmup_steps: 2
min_learning_rate: 3.0e-5

# Stability
max_grad_norm: 1.0

# Precision
mixed_precision: fp16

# Evaluation
eval_interval: 5
eval_batches: 2

# Checkpointing
checkpoint_interval: 5
keep_last_checkpoints: 3

# Logging
log_interval: 1
